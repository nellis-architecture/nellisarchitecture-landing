  <script>
    document.addEventListener("DOMContentLoaded", () => {


      let WIDTH2 = window.innerWidth;
      let mobile = false;
      if (WIDTH2 <= 1179) {
        mobile = true;
      } else {
        mobile = false;
      }
      window.addEventListener("resize", () => {
        WIDTH2 = window.innerWidth;
        if (WIDTH2 <= 1179) {
          mobile = true;
        } else {
          mobile = false;
        }
      });


      const arrowUp = document.querySelector('.arrowUp');
      let winH = document.documentElement.scrollHeight;
      window.addEventListener('scroll', () => {
        if (window.scrollY + window.innerHeight <= winH - 260) {
          arrowUp.style.position = 'fixed';
          arrowUp.style.bottom = '30px';
        } else if (WIDTH2 >= 1700) {
          arrowUp.style.position = 'absolute';
          arrowUp.style.bottom = '260px';
        }
        if (window.scrollY + window.innerHeight <= winH - 230) {
          arrowUp.style.position = 'fixed';
          arrowUp.style.bottom = '30px';
        } else if (WIDTH2 <= 1700) {
          arrowUp.style.position = 'absolute';
          arrowUp.style.bottom = '260px';
        }
      });



      const itemsHead = document.querySelectorAll(".accord__itemHead");
      const itemsContent = document.querySelectorAll(
        ".accord__itemContent"
      );
      let WIDTH = window.innerWidth;
      window.addEventListener("resize", () => {
        WIDTH = window.innerWidth;
      });
      const itemsImg = document.querySelectorAll(".accord__itemImg");
      const decorArrow = document.querySelectorAll(".decorArrow");
      const accordName = document.querySelectorAll(".accordName");
      const accordItem = document.querySelectorAll(".accord__item");
      const decorArrow2 = document.querySelectorAll(".decorArrow2");
      for (let i = 0; i <= itemsImg.length - 1; i++) {
        if (WIDTH >= 1700) {
          itemsImg[i].style.top = i * 60 + "px";
        }
        if (WIDTH <= 1700) {
          itemsImg[i].style.top = i * 60 + "px";
        }
        decorArrow2[i].style.display = "none";
      }
      itemsHead.forEach((el, index) => {
        el.addEventListener("click", () => {

          let content = el.nextElementSibling;
          itemsHead.forEach(element => {
            element.nextElementSibling.style.padding = '0px';
          });
          if (
            content.style.maxHeight != "0px" &&
            content.style.maxHeight == ""
          ) {
            //открытие
            itemsContent.forEach((el) => (el.style.maxHeight = "0px"));
            itemsContent.forEach((el) => (el.style.maxHeight = null));
            // itemsImg.forEach((el) => (el.style.height = "auto"));
            itemsImg.forEach((el) => (el.style.maxWidth = "0px"));
            itemsHead.forEach((el) => el.classList.add("openAccord"));
            decorArrow.forEach((el) => (el.style.opacity = "0"));
            accordName.forEach((el) => (el.style.transform = "scale(1)"));
            content.style.maxHeight = content.scrollHeight + 60 + "px";
            content.style.padding = "20px 0 40px";
            if (WIDTH >= 1700 && WIDTH >= 480) {
              itemsImg[index].style.maxWidth = "1000px";
            }
            if (WIDTH <= 1700 && WIDTH >= 480) {
              itemsImg[index].style.maxWidth = "330px";
            }
            if (WIDTH <= 1179 && WIDTH >= 980) {
              itemsImg[index].style.maxWidth = "270px";
              itemsImg[index].style.maxHeight = "500px";
            }
            if (WIDTH <= 1179 && WIDTH >= 759 && WIDTH >= 480) {
              itemsImg.forEach((el) => (el.style.maxHeight = "0px"));
              accordItem.forEach(
                (el) => (el.style.gridTemplateColumns = "80% 20%")
              );
              itemsImg[index].style.width = "100%";
              itemsImg[index].style.maxHeight = "400px";
            }
            if (WIDTH <= 759 && WIDTH >= 200) {
              itemsImg.forEach((el) => (el.style.maxHeight = "0px"));
              accordItem.forEach(
                (el) => (el.style.gridTemplateColumns = "70% 30%")
              );
              itemsImg[index].style.width = "100%";
              itemsImg[index].style.maxHeight = "140px";
            }
            if (WIDTH <= 480) {
              accordItem.forEach(
                (el) => (el.style.gridTemplateColumns = "70% 30%")
              );
              itemsImg[index].style.maxWidth = "270px";
              itemsImg[index].style.width = "100%";
            }
            decorArrow[index].style.opacity = "1";
            accordName[index].style.transform = "scale(1.3)";
          } else {
            //закрытие
            itemsImg.forEach((el) => (el.style.maxWidth = "0px"));
            decorArrow.forEach((el) => (el.style.opacity = "0"));
            itemsHead.forEach((el) => el.classList.remove("openAccord"));
            accordName.forEach((el) => (el.style.transform = "scale(1)"));
            content.style.maxHeight = "0px";
            itemsImg.forEach((el) => (el.style.maxHeight = "0px"));
            content.style.padding = "0px";
            content.style.maxHeight = "";

            if (WIDTH <= 1179 && WIDTH >= 480) {
              accordItem.forEach(
                (el) => (el.style.gridTemplateColumns = "100% 0%")
              );
            }
            if (WIDTH <= 480) {
              decorArrow2.forEach((el) => (el.style.display = "none"));
              // itemsImg[index].style.height = "12px";
            }
            if (WIDTH <= 1179 && WIDTH >= 200) {
              itemsImg.forEach(
                (el) => (el.style.style.maxHeight = "0px")
              );
            }
          }
        });
      });
    });
  </script>
