    <script>

                mobile = false;
            }
            window.addEventListener("resize", () => {
                winH = document.documentElement.scrollHeight;
                WIDTH2 = window.innerWidth;
                if (WIDTH2 <= 1179) {
                    mobile = true;
                } else {
                    mobile = false;
                }
            });

            const arrowUp = document.querySelector(".arrowUp");
            let winH = document.documentElement.scrollHeight;
            window.addEventListener("scroll", () => {
                if (window.scrollY + window.innerHeight <= winH - 359) {
                    arrowUp.style.position = "fixed";
                    arrowUp.style.bottom = "30px";
                } else if (WIDTH2 >= 1700) {
                    arrowUp.style.position = "absolute";
                    arrowUp.style.bottom = "250px";
                }
                if (window.scrollY + window.innerHeight <= winH - 220) {
                    arrowUp.style.position = "fixed";

                } else if (WIDTH2 <= 1700) {

        });
