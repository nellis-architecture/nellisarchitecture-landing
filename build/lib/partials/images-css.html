<style id="nellis-images-css">
	/* picture() markup (build/lib/images.js) keeps the layout of the img-protect.js wrapper
	   (inline-block, line-height 0): the img percentage heights stay unresolved, as before.
	   width 100% and the inline max-width (the file width) give the box of the old wrapper,
	   min(container, file width), before the image loads: no layout shift.
	   height: auto: the width and height attributes give only the aspect ratio. */
	picture {
		display: inline-block;
		width: 100%;
		line-height: 0;
		background-position: center;
	}

	picture img {
		height: auto;
	}

	/* Only with JS (the script below): a lazy image shows the picture LQIP background,
	   then fades in on load or error. The priority image is eager: it never fades. */
	.js picture img[loading="lazy"] {
		transition: opacity 400ms;
	}

	.js picture img[loading="lazy"]:not(.is-loaded) {
		opacity: 0;
	}

	@media (prefers-reduced-motion: reduce) {
		.js picture img[loading="lazy"] {
			transition: none;
		}
	}
</style>
<script id="nellis-images-js">
	(function imagesFade() {
		'use strict';

		const d = document;
		const mark = (img) => img.classList.add('is-loaded');
		const scan = (node) => {
			if (node.tagName === 'IMG') {
				if (node.complete) mark(node);
			} else if (node.querySelectorAll) {
				node.querySelectorAll('img').forEach((img) => img.complete && mark(img));
			}
		};
		const onDone = (e) => e.target.tagName === 'IMG' && mark(e.target);
		d.documentElement.classList.add('js');
		d.addEventListener('load', onDone, true);
		d.addEventListener('error', onDone, true);
		d.addEventListener('DOMContentLoaded', () => {
			scan(d);
			new MutationObserver((list) => list.forEach((m) => m.addedNodes.forEach(scan)))
				.observe(d.body, { childList: true, subtree: true });
		});
	}());
</script>
