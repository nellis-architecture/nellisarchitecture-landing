# Decap CMS configuration — Nellis Architecture news
# base_url is the workers.dev Worker until the DNS cutover (card 9 sets the apex).

backend:
  name: github
  repo: nellis-architecture/nellisarchitecture-landing
  branch: master
  base_url: https://landing.nellisarchitecture.workers.dev
  auth_endpoint: api/auth

publish_mode: editorial_workflow

# Local editing: run `npm run cms` with `npm run serve`, then open http://localhost:8000/admin/.
# Decap uses this only on localhost.
local_backend: true

media_folder: "wp-content/uploads/news"
public_folder: "/wp-content/uploads/news"

site_url: https://nellisarchitecture.com
logo_url: https://nellisarchitecture.com/wp-content/uploads/2025/02/logo.png

collections:
  - name: "news"
    label: "News"
    label_singular: "News article"
    folder: "content/news"
    create: true
    slug: "{{fields.slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Publication date"
        name: "date"
        widget: "datetime"
        format: "MMMM D, YYYY"
        date_format: "MMMM D, YYYY"
        time_format: false
      - { label: "URL slug", name: "slug", widget: "string", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, digits and single dashes only"], hint: "Lowercase words separated by dashes. A change after publish adds a 301 from the old URL. A second change needs a manual rule in Redirects." }
      - { label: "SEO title", name: "seo_title", widget: "string", required: false, hint: "Browser tab / Google result title. Leave empty to use the article title." }
      - { label: "Custom JSON-LD", name: "schema", widget: "text", required: false, hint: "Optional. Extra JSON-LD, added after the generated schema. Must be a JSON object or array. Write the JSON on more than one line." }
      - { label: "Meta description", name: "description", widget: "text", required: false, hint: "150–160 characters shown under the title in Google. Also shows as the excerpt on /news/." }
      - { label: "Hide from search (noindex)", name: "noindex", widget: "boolean", default: false, required: false, hint: "On: Google does not show the article, and the sitemap does not list it. The article stays on the site and in the news list." }
      # Cloudflare allows 25 MiB per asset; Decap refuses a file with size > max_file_size.
      - { label: "Hero image", name: "hero", widget: "image", required: false, media_library: &upload_limit { config: { max_file_size: 26214399 } }, hint: "Files must be smaller than 25 MB (26214 kB)." }
      - { label: "Hero image alt text", name: "hero_alt", widget: "string", required: false }
      - { label: "External link (optional)", name: "link", widget: "string", required: false, hint: "If set, a MORE INFO button appears under the article pointing here." }
      - { label: "Body", name: "body", widget: "markdown", media_library: *upload_limit, hint: "Files must be smaller than 25 MB (26214 kB)." }

  - name: "pages"
    label: "Pages"
    format: "json"
    delete: false
    files:
      - name: "site"
        label: "Shared (affiliations, forms)"
        file: "content/pages/site.json"
        fields:
          - label: "Affiliations"
            name: "affiliations"
            widget: "list"
            hint: &site_hint "Changes show on Home, Studio, People, Privacy, Contact, the News index and the project and category pages. News articles keep the old values."
            fields:
              - { label: "Logo", name: "src", widget: "image", media_folder: "/wp-content/uploads/pages", public_folder: "/wp-content/uploads/pages", media_library: *upload_limit, hint: "Changes show on Home, Studio, People, Privacy, Contact, the News index and the project and category pages. News articles keep the old values. Files must be smaller than 25 MB (26214 kB)." }
              - { label: "Alt text", name: "alt", widget: "string", required: false, hint: *site_hint }
              - { label: "Title", name: "title", widget: "string", required: false, hint: *site_hint }
              - { label: "Width (px)", name: "width", widget: "number", value_type: "int", hint: *site_hint }
              - { label: "Height (px)", name: "height", widget: "number", value_type: "int", hint: *site_hint }
          - label: "Forms"
            name: "forms"
            widget: "object"
            hint: *site_hint
            fields:
              - label: "Contact form (Have a project?)"
                name: "contact"
                widget: "object"
                hint: *site_hint
                fields: &form_fields
                  - { label: "Title", name: "title", widget: "string", hint: *site_hint }
                  - { label: "Description", name: "description", widget: "string", hint: *site_hint }
                  - { label: "Button", name: "button", widget: "string", hint: *site_hint }
                  - { label: "E-mail", name: "email", widget: "string", hint: *site_hint }
              - label: "Skills form (Got skills?)"
                name: "skills"
                widget: "object"
                hint: *site_hint
                fields: *form_fields
              - { label: "Delete uploaded files after (days)", name: "file_days", widget: "number", value_type: "int", min: 1, max: 365, hint: "Days before uploaded files are deleted. Change the Privacy page text too." }
      - name: "index"
        label: "Home"
        file: "content/pages/index.json"
        fields:
          - { label: "H1 (hidden heading)", name: "h1", widget: "string" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/ (fixed, not editable)."
            fields: &seo_fields
              - { label: "SEO title", name: "title", widget: "string", required: false, hint: "Browser tab and Google result title. Leave empty to use the page title." }
              - { label: "Social title (og:title)", name: "og_title", widget: "string", required: false, hint: "Title for shared links. Leave empty to use the SEO title." }
              - { label: "Meta description", name: "description", widget: "text", hint: "150–160 characters shown under the title in Google." }
              - { label: "Canonical URL", name: "canonical", widget: "string", required: false, pattern: ['^$|^https://nellisarchitecture\.com/', "Leave empty, or start with https://nellisarchitecture.com/"], hint: "Leave empty to use the page URL." }
              - { label: "Hide from search (noindex)", name: "noindex", widget: "boolean", default: false, hint: "On: Google does not show the page, and the sitemap does not list it." }
              - { label: "Custom JSON-LD", name: "schema", widget: "text", required: false, hint: "Optional. Extra JSON-LD, added after the generated schema. Must be a JSON object or array. Write the JSON on more than one line." }
      - name: "privacy"
        label: "Privacy"
        file: "content/pages/privacy.json"
        fields:
          - { label: "H1 (hidden heading)", name: "h1", widget: "string" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/privacy/ (fixed, not editable)."
            fields: *seo_fields
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "text", hint: "Plain text, no HTML. Each line shows as a separate paragraph." }
      - name: "studio"
        label: "Studio"
        file: "content/pages/studio.json"
        fields:
          - { label: "H1 (hidden heading)", name: "h1", widget: "string" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/studio/ (fixed, not editable)."
            fields: *seo_fields
          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "Shows as the page heading and in the Studio menu." }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "object"
                fields: &page_image
                  - { label: "Image", name: "src", widget: "image", media_folder: "/wp-content/uploads/pages", public_folder: "/wp-content/uploads/pages", media_library: *upload_limit, hint: "Files must be smaller than 25 MB (26214 kB)." }
                  - { label: "Alt text", name: "alt", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string", required: false, hint: "Shows when the pointer is on the image. Leave empty for no title." }
                  - { label: "Width (px)", name: "width", widget: "number", value_type: "int" }
                  - { label: "Height (px)", name: "height", widget: "number", value_type: "int" }
              - { label: "Quote", name: "quote", widget: "text", hint: "Plain text, no HTML. Each line shows as a separate line." }
              - { label: "Quote author", name: "quote_author", widget: "string", hint: "The page adds the dash before the name." }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", min: 2, max: 2, field: { label: "Paragraph", name: "paragraph", widget: "text" }, hint: "Two paragraphs. Each shows on mobile and on desktop." }
              - { label: "Big image", name: "big_image", widget: "object", fields: *page_image }
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "Shows as the section heading and in the Studio menu." }
              - { label: "Button", name: "button", widget: "string", hint: "Text on each service button." }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Link", name: "link", widget: "string", hint: "For example /projects/architecture/." }
          - label: "Values"
            name: "values"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "Shows as the section heading and in the Studio menu." }
              - label: "Items"
                name: "items"
                widget: "list"
                hint: "Each value shows twice in the moving line."
                fields:
                  - { label: "Title", name: "title", widget: "string", hint: "Do not type a colon. The page adds the colon after the title." }
                  - { label: "Text", name: "text", widget: "text" }
          - label: "Founder"
            name: "founder"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "Shows as the section heading and in the Studio menu." }
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Photo", name: "photo", widget: "object", fields: *page_image }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Text", name: "text", widget: "text" }
      - name: "people"
        label: "People"
        file: "content/pages/people.json"
        fields:
          - { label: "H1 (hidden heading)", name: "h1", widget: "string" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/people/ (fixed, not editable)."
            fields: *seo_fields
          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "Shows as the page heading." }
              - { label: "Paragraphs", name: "paragraphs", widget: "list", min: 1, field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - { label: "Image", name: "image", widget: "object", fields: *page_image }
          - label: "People"
            name: "people"
            widget: "list"
            summary: "{{fields.name}}"
            hint: "The page shows the people in this order. Drag an item to move it."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "object", fields: *page_image }
              - { label: "Bio", name: "bio", widget: "text", hint: "Plain text, no HTML. The page joins the lines into one paragraph." }
      - name: "projects"
        label: "Projects: All"
        file: "content/pages/projects.json"
        fields: &category_fields
          - { label: "H1 (page heading)", name: "h1", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", hint: "Plain text, no HTML. Shows above the project list." }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/projects/ (All) or /projects/<category>/ (fixed, not editable)."
            fields: *seo_fields
      - name: "projects-architecture"
        label: "Projects: Architecture"
        file: "content/pages/projects-architecture.json"
        fields: *category_fields
      - name: "projects-master-planning"
        label: "Projects: Master Planning"
        file: "content/pages/projects-master-planning.json"
        fields: *category_fields
      - name: "projects-interior-design"
        label: "Projects: Interior Design"
        file: "content/pages/projects-interior-design.json"
        fields: *category_fields
      - name: "projects-landscape"
        label: "Projects: Landscape"
        file: "content/pages/projects-landscape.json"
        fields: *category_fields
      - name: "news"
        label: "News: index"
        file: "content/pages/news.json"
        fields:
          - { label: "H1 (page heading)", name: "h1", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", hint: "Plain text, no HTML. Shows above the news list." }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/news/ (fixed, not editable)."
            fields: *seo_fields
      - name: "contact"
        label: "Contact"
        file: "content/pages/contact.json"
        fields:
          - { label: "H1 (page heading)", name: "h1", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text", hint: "Plain text, no HTML. Shows above the address and the form." }
          - { label: "Address", name: "address", widget: "hidden", default: "Ground Floor, Building 4, Mangrove Avenue A, Sustainability District, Expo City, Dubai, UAE" }
          - label: "SEO"
            name: "seo"
            widget: "object"
            hint: "Page URL: https://nellisarchitecture.com/contact/ (fixed, not editable)."
            fields: *seo_fields
      - name: "robots"
        label: "robots.txt"
        file: "content/robots.json"
        fields:
          - { label: "Rules", name: "rules", widget: "text", hint: "Crawl rules for https://nellisarchitecture.com/robots.txt. The build adds the Sitemap line; a Sitemap line typed here is dropped." }

  - name: "redirects"
    label: "Redirects"
    format: "json"
    delete: false
    files:
      - name: "redirects"
        label: "Redirects (301)"
        file: "content/redirects.json"
        fields:
          - label: "Redirects"
            name: "redirects"
            widget: "list"
            summary: "{{fields.from}} → {{fields.to}}"
            hint: "Each rule sends an old URL to a new URL with a permanent (301) redirect. A changed news slug gets its rule automatically."
            fields:
              - { label: "From", name: "from", widget: "string", pattern: ['^/(?!.*(\.\.|//))[A-Za-z0-9._~/-]*$', "Start with /. Use letters, digits and . _ ~ - / only. No .. or //."], hint: "Old path, starts with /, e.g. /old-page/. Upper and lower case are different." }
              - { label: "To", name: "to", widget: "string", pattern: ['^(/(?!/)(?!.*(\.\.|//))|https://)', "Start with / or https://. No .. or //."], hint: "New path on this site, e.g. /studio/, or a full https:// URL." }
              - { label: "Note", name: "note", widget: "text", required: false }
